<!doctype html><html lang="fr"><meta charset="utf-8"><title>Contrôle du zoom Ctrl molette</title><style>body{margin:0;font:14px sans-serif}iframe{width:100%;height:90vh;border:0}button{padding:10px}output{padding:10px}</style><button id="zoom">Simuler Ctrl + molette vers le haut</button><button id="plain">Simuler une molette sans Ctrl</button><output id="result"></output><iframe src="/" title="Éditeur à tester"></iframe><script>
function run(ctrl){const doc=document.querySelector('iframe').contentDocument,viewport=doc.querySelector('.canvas-space');if(!viewport){document.querySelector('output').textContent='Ouvrir la vue Éditer.';return;}const before=doc.querySelector('.zoom-reset').textContent,rect=viewport.getBoundingClientRect(),event=new WheelEvent('wheel',{bubbles:true,cancelable:true,ctrlKey:ctrl,deltaY:-120,clientX:rect.left+rect.width/2,clientY:rect.top+rect.height/2});viewport.dispatchEvent(event);requestAnimationFrame(()=>document.querySelector('output').textContent=`Avant : ${before} ; après : ${doc.querySelector('.zoom-reset').textContent} ; molette capturée : ${event.defaultPrevented}`);}
document.querySelector('#zoom').onclick=()=>run(true);document.querySelector('#plain').onclick=()=>run(false);
</script></html>
