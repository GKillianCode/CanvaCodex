<!doctype html><html lang="fr"><meta charset="utf-8"><title>Frame · contrôle des dispositions</title><style>body{background:#101817;color:#eff7f3;font:14px Arial;margin:32px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}canvas{width:100%;display:block;border-radius:12px}h2{font-size:14px}section{min-width:0}header{margin-bottom:24px}small{color:#9ab4aa}</style><header><h1>30 dispositions · 10 thèmes</h1><small>Rendu partagé avec les exports · tous les éléments révélés</small></header><main id="atlas"></main><script type="module">
